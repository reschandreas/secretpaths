apiVersion: v1
kind: Pod
metadata:
  name: {{ include "secretpaths.fullname" . }}-test-connection
  labels:
    {{- include "secretpaths.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command: ['sh', '-c']
      args:
        - |
          set -e
          wget -qO- http://{{ include "secretpaths.fullname" . }}:{{ .Values.service.serverPort }}/v1/healthz
          wget -qO- http://{{ include "secretpaths.fullname" . }}:{{ .Values.service.serverPort }}/v1/readyz