replicaCount: 1

image:
  repository: ghcr.io/reschandreas/secretpaths
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

config:
  vaultAddr: http://127.0.0.1:8200
  kubernetesRole: secretpaths
  kvEngine: secret

serviceAccount:
  create: true
  automount: true

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 20
  targetCPUUtilizationPercentage: 80

gateway:
  enabled: false
  className: ""
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same

httpRoute:
  enabled: true
  parentRefs:
    - name: secretpaths-gateway
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - port: 8081
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - port: 8080


service:
  type: ClusterIP
  port: 8080
  serverPort: 8081

podSecurityContext: {}

resources: {}

securityContext: {}

livenessProbe:
  httpGet:
    path: /v1/healthz
    port: http-server
readinessProbe:
  httpGet:
    path: /v1/readyz
    port: http-server